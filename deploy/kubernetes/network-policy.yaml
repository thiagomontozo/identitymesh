apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-traffic}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: identitymesh-frontend}}
  policyTypes: [Ingress, Egress]
  ingress:
    # Narrow this selector to the ingress-controller namespace/pods in the target cluster.
    - from: [{namespaceSelector: {}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: identitymesh-backend}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: backend-traffic}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: identitymesh-backend}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: identitymesh-frontend}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # PostgreSQL, Vault and configured HTTPS/LDAP providers may be outside the cluster.
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 389}
        - {protocol: TCP, port: 636}
        - {protocol: TCP, port: 5432}
