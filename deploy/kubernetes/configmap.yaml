apiVersion: v1
kind: ConfigMap
metadata: {name: identitymesh-config}
data:
  IDENTITYMESH_ENV: production
  IDENTITYMESH_HTTP_ADDR: :8080
  IDENTITYMESH_ALLOWED_ORIGIN: https://identitymesh.example.com
  IDENTITYMESH_SECURE_COOKIES: "true"
  IDENTITYMESH_REQUIRE_MFA_FOR_PRIVILEGED_ROLES: "true"
  IDENTITYMESH_JOB_MODE: DISTRIBUTED
  IDENTITYMESH_SECRET_PROVIDER: VAULT_TRANSIT
  IDENTITYMESH_VAULT_ADDR: https://vault.example.com
  IDENTITYMESH_VAULT_TRANSIT_MOUNT: transit
  IDENTITYMESH_VAULT_TRANSIT_KEY: identitymesh
  IDENTITYMESH_MAX_CONCURRENT_SYNCS: "4"
  IDENTITYMESH_MAX_CONCURRENT_ACTIONS: "4"
  IDENTITYMESH_WORKER_LEASE: 2m
  IDENTITYMESH_WORKER_POLL_INTERVAL: 500ms
  # Replace with the actual pod/ingress proxy CIDRs for this cluster.
  IDENTITYMESH_TRUSTED_PROXY_CIDRS: 10.0.0.0/8
  IDENTITYMESH_DEFAULT_SYNC_TIMEOUT: 30s
  IDENTITYMESH_MAX_CSV_BYTES: "10485760"
