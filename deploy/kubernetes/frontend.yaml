apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, labels: {app.kubernetes.io/name: identitymesh-frontend}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: identitymesh-frontend}}
  template:
    metadata: {labels: {app.kubernetes.io/name: identitymesh-frontend}}
    spec:
      serviceAccountName: identitymesh
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: ghcr.io/thiagomontozo/identitymesh-frontend:latest
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  selector: {app.kubernetes.io/name: identitymesh-frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
