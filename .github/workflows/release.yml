name: Container delivery
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: backend/Dockerfile
            image: identitymesh-backend
          - component: frontend
            dockerfile: frontend/Dockerfile
            image: identitymesh-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/thiagomontozo/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with: {context: ., file: '${{ matrix.dockerfile }}', push: true, tags: '${{ steps.meta.outputs.tags }}', labels: '${{ steps.meta.outputs.labels }}', provenance: true, sbom: true}
