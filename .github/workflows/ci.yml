name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.6', cache: true}
      - name: Formatting
        run: test -z "$(gofmt -l backend test/mock-scim)"
      - run: go vet ./backend/...
      - name: Reachable vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./backend/...
      - run: go test -race -coverprofile=coverage.out ./backend/...
      - run: go build -o /tmp/identitymesh ./backend/cmd/server
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.6', cache: true}
      - name: Start synthetic providers
        run: docker compose -f compose.test.yml up -d --build --wait
      - name: PostgreSQL, SCIM, LDAP, Vault and lifecycle E2E
        env:
          IDENTITYMESH_TEST_DATABASE_URL: postgres://identitymesh:identitymesh-test-only@localhost:55432/identitymesh_test?sslmode=disable
          IDENTITYMESH_TEST_SCIM_URL: http://localhost:18090/scim/v2
          IDENTITYMESH_TEST_SCIM_B_URL: http://localhost:18091/scim/v2
          IDENTITYMESH_TEST_LDAP_URL: ldap://localhost:1389
          IDENTITYMESH_TEST_VAULT_URL: http://localhost:18200
        run: go test -tags=integration -count=1 ./backend/...
      - name: Synthetic resource logs
        if: failure()
        run: docker compose -f compose.test.yml logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f backend/Dockerfile -t identitymesh-backend:test .
      - run: docker build -f frontend/Dockerfile -t identitymesh-frontend:test .
  browser-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Start isolated synthetic application
        env: {IDENTITYMESH_BOOTSTRAP_ADMIN_PASSWORD: identitymesh-demo-password}
        run: docker compose --profile demo up -d --build --wait
      - name: Seed synthetic identity graph
        run: docker compose exec -T postgres psql -U identitymesh -d identitymesh < test/fixtures/demo.sql
      - name: Playwright offboarding smoke
        run: cd frontend && npm exec playwright test -- --config=playwright.config.ts
      - name: Cleanup
        if: always()
        run: docker compose --profile demo down -v --remove-orphans
