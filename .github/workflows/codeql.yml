name: CodeQL
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  schedule: [{cron: '17 4 * * 2'}]
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {language: [go, javascript-typescript]}}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with: {go-version: '1.26.6', cache: true}
      - if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with: {node-version: '22.19.0', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: github/codeql-action/init@v3
        with: {languages: '${{ matrix.language }}'}
      - if: matrix.language == 'go'
        run: go build ./backend/cmd/server
      - if: matrix.language == 'javascript-typescript'
        run: cd frontend && npm ci && npm run build
      - uses: github/codeql-action/analyze@v3
