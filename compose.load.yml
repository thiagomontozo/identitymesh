name: identitymesh-load
x-backend: &backend
  image: identitymesh-backend:load
  build: {context: ., dockerfile: backend/Dockerfile}
  labels: {com.identitymesh.managed: "true", com.identitymesh.purpose: test}
  environment: &backend-env
    IDENTITYMESH_ENV: test
    IDENTITYMESH_HTTP_ADDR: :8080
    IDENTITYMESH_DATABASE_URL: postgres://identitymesh:identitymesh-load-only@postgres-load:5432/identitymesh_load?sslmode=disable
    IDENTITYMESH_SESSION_SECRET: load-test-session-secret-at-least-32-bytes
    IDENTITYMESH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    IDENTITYMESH_ALLOWED_ORIGIN: http://localhost
    IDENTITYMESH_SECURE_COOKIES: "false"
    IDENTITYMESH_BOOTSTRAP_ADMIN_EMAIL: load@example.test
    IDENTITYMESH_BOOTSTRAP_ADMIN_PASSWORD: load-test-password-only
    IDENTITYMESH_JOB_MODE: DISTRIBUTED
    IDENTITYMESH_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
    IDENTITYMESH_MAX_CONCURRENT_SYNCS: 4
    IDENTITYMESH_MAX_CONCURRENT_ACTIONS: 8
  depends_on: {postgres-load: {condition: service_healthy}}
  healthcheck: {test: ["CMD", "/app/identitymesh-healthcheck"], interval: 5s, timeout: 3s, retries: 30}
services:
  postgres-load:
    image: postgres:16-alpine
    labels: {com.identitymesh.managed: "true", com.identitymesh.purpose: test}
    environment: {POSTGRES_DB: identitymesh_load, POSTGRES_USER: identitymesh, POSTGRES_PASSWORD: identitymesh-load-only}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    volumes: [postgres-load-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U identitymesh -d identitymesh_load"], interval: 2s, timeout: 3s, retries: 30}
  backend-a:
    <<: *backend
    environment: {<<: *backend-env, IDENTITYMESH_WORKER_ID: load-worker-a}
  backend-b:
    <<: *backend
    environment: {<<: *backend-env, IDENTITYMESH_WORKER_ID: load-worker-b}
  load-balancer:
    image: nginx:1.27-alpine
    labels: {com.identitymesh.managed: "true", com.identitymesh.purpose: test}
    volumes: [./deploy/load/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: {backend-a: {condition: service_healthy}, backend-b: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"], interval: 3s, timeout: 2s, retries: 20}
  load-test:
    build: {context: ., dockerfile: test/load/Dockerfile}
    labels: {com.identitymesh.managed: "true", com.identitymesh.purpose: test}
    environment:
      IDENTITYMESH_LOAD_BASE_URL: http://load-balancer:8080
      IDENTITYMESH_LOAD_USERS: ${IDENTITYMESH_LOAD_USERS:-100}
      IDENTITYMESH_LOAD_REQUESTS_PER_USER: ${IDENTITYMESH_LOAD_REQUESTS_PER_USER:-100}
      IDENTITYMESH_LOAD_MAX_P95_MS: ${IDENTITYMESH_LOAD_MAX_P95_MS:-750}
      IDENTITYMESH_LOAD_MAX_ERROR_PERMILLE: ${IDENTITYMESH_LOAD_MAX_ERROR_PERMILLE:-10}
    depends_on: {load-balancer: {condition: service_healthy}}
volumes:
  postgres-load-data: {labels: {com.identitymesh.managed: "true", com.identitymesh.purpose: test}}
networks:
  default: {labels: {com.identitymesh.managed: "true", com.identitymesh.purpose: test}}
